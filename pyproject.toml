[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-blackjack-solver"
version = "1.0.0"
description = "Exact infinite-deck blackjack action and round expected values"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blackjack = "blackjack.cli:main"

[tool.setuptools.packages.find]
include = ["blackjack*"]

[tool.setuptools.package-data]
blackjack = ["web/*.html", "web/*.css", "web/*.js"]
